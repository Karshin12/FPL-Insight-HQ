<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Insights HQ</title>
    
    <!-- IMPORT MODERN GOOGLE FONT: PLUS JAKARTA SANS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* APPLY FONT GLOBALLY AND OVERRIDE TAILWIND SANS DEFAULTS */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        /* PITCH ROW & CARD DIMENSIONS */
        .pos-row { 
            display: flex; 
            justify-content: center; 
            gap: 14px; 
            min-height: 82px; 
        }
        
        .pos-row-lg { 
            display: flex; 
            justify-content: center; 
            gap: 16px; 
            margin-bottom: 20px; 
            min-height: 92px; 
        }
        
        .player-card-ui { 
            width: 96px; 
            height: 76px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.15s ease, box-shadow 0.15s ease; 
        }
        .player-card-ui:hover { 
            transform: scale(1.05); 
        }

        .player-card-lg { 
            width: 105px; 
            height: 86px; 
            border-radius: 10px; 
            transition: transform 0.15s ease; 
        }
        .player-card-lg:hover { 
            transform: scale(1.04); 
        }

        #scout-list::-webkit-scrollbar,
        #roster-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        #scout-list::-webkit-scrollbar-track,
        #roster-scroll-container::-webkit-scrollbar-track {
            background: rgba(30, 11, 48, 0.4);
            border-radius: 8px;
        }
        #scout-list::-webkit-scrollbar-thumb,
        #roster-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(52, 211, 153, 0.5);
            border-radius: 8px;
        }
        #scout-list::-webkit-scrollbar-thumb:hover,
        #roster-scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(52, 211, 153, 0.8);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

    <!-- NAVIGATION HEADER -->
    <header class="bg-purple-950/80 border-b border-purple-800/50 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-[1600px] mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399] animate-pulse"></span>
            
                <h1 class="text-2xl font-black tracking-tight uppercase text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-200 to-cyan-400 drop-shadow-[0_2px_8px_rgba(52,211,153,0.2)]" style="font-family: 'Outfit', sans-serif;">
                FPL Insights <span class="text-emerald-400 font-extrabold tracking-normal">HQ</span>
                </h1>
            </div>
    
            <div class="flex gap-2">
                <button id="tab-builder" class="px-4 py-2 text-xs font-black uppercase rounded-lg bg-emerald-400 text-purple-950 transition-all">Lineup Builder</button>
                <button id="tab-recommended" class="px-4 py-2 text-xs font-black uppercase rounded-lg text-emerald-300 hover:bg-purple-900/50 transition-all">Recommendation</button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto p-4">

        <!-- PAGE 1: LINEUP BUILDER -->
        <div id="page-builder" class="flex flex-col gap-5">
            
            <!-- STATS SUMMARY BANNER (COUNTDOWN BUDGET) -->
            <div class="bg-purple-950/40 border border-purple-800/50 p-4 rounded-xl flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div>
                        <span class="text-xs text-purple-300 uppercase font-bold block">Remaining Budget</span>
                        <span id="total-cost" class="text-2xl font-black text-white">£100.0m</span>
                    </div>
                    <!-- DYNAMIC ERROR BADGE FOR OVER-BUDGET SQUADS -->
                    <span id="budget-error" class="hidden bg-red-900/80 text-red-200 text-xs font-black px-2.5 py-1 rounded-md border border-red-600 uppercase tracking-wider animate-pulse">
                        ⚠️ Squad value exceeded
                    </span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-purple-300 uppercase font-bold block">Expected Points</span>
                    <span id="xi-pts" class="text-2xl font-black text-emerald-400">0.0 Pts</span>
                </div>
            </div>

            <!-- MAIN WORKSPACE: 3-COLUMN LAYOUT -->
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
                
                <!-- COLUMN 1 (LEFT): PLAYER SELECTION PANEL -->
                <div class="xl:col-span-3 bg-purple-950/30 border border-purple-800/50 rounded-2xl p-4 flex flex-col gap-3 h-[780px]">
                    <h3 class="text-sm font-black uppercase text-emerald-400 tracking-wide">Player Selection</h3>
                    
                    <input type="text" id="player-search" placeholder="Search player name..." class="w-full bg-purple-950 border border-purple-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <select id="pos-filter" class="bg-purple-950 border border-purple-800 text-xs text-purple-200 rounded-lg p-2 focus:outline-none">
                            <option value="All">All Pos</option>
                            <option value="GK">GK</option>
                            <option value="DEF">DEF</option>
                            <option value="MID">MID</option>
                            <option value="FWD">FWD</option>
                        </select>
                        
                        <select id="team-filter" class="bg-purple-950 border border-purple-800 text-xs text-purple-200 rounded-lg p-2 focus:outline-none">
                            <option value="All">All Teams</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="price-filter" class="bg-purple-950 border border-purple-800 text-xs text-purple-200 rounded-lg p-2 focus:outline-none">
                            <option value="20.0">Any Price</option>
                            <option value="4.0">Max £4.0m</option>
                            <option value="4.5">Max £4.5m</option>
                            <option value="5.0">Max £5.0m</option>
                            <option value="5.5">Max £5.5m</option>
                            <option value="6.0">Max £6.0m</option>
                            <option value="6.5">Max £6.5m</option>
                            <option value="7.0">Max £7.0m</option>
                            <option value="7.5">Max £7.5m</option>
                            <option value="8.0">Max £8.0m</option>
                            <option value="8.5">Max £8.5m</option>
                            <option value="9.0">Max £9.0m</option>
                            <option value="9.5">Max £9.5m</option>
                            <option value="10.0">Max £10.0m</option>
                            <option value="10.5">Max £10.5m</option>
                            <option value="11.0">Max £11.0m</option>
                            <option value="11.5">Max £11.5m</option>
                            <option value="12.0">Max £12.0m</option>
                            <option value="12.5">Max £12.5m</option>
                            <option value="13.0">Max £13.0m</option>
                            <option value="13.5">Max £13.5m</option>
                            <option value="14.0">Max £14.0m</option>
                            <option value="14.5">Max £14.5m</option>
                            <option value="15.0">Max £15.0m</option>
                            <option value="15.5">Max £15.5m</option>
                        </select>

                        <select id="stat-filter" class="bg-purple-950 border border-purple-800 text-xs text-emerald-400 font-bold rounded-lg p-2 focus:outline-none">
                            <option value="selected_by_percent">Selected %</option>
                            <option value="gw_points">Total Points</option>
                            <option value="goals_scored">Goals Scored</option>
                            <option value="assists">Assists</option>
                            <option value="expected_goals">xG (Expected Goals)</option>
                            <option value="expected_assists">xA (Expected Assists)</option>
                            <option value="expected_goal_involvements">xGI (Expected Goal Inv.)</option>
                            <option value="expected_goals_conceded">xGC (Expected Conceded)</option>
                            <option value="form">Form Rating</option>
                            <option value="bonus">Bonus Points</option>
                            <option value="bps">BPS System Score</option>
                            <option value="ict_index">ICT Index</option>
                            <option value="influence">Influence</option>
                            <option value="creativity">Creativity</option>
                            <option value="threat">Threat</option>
                            <option value="minutes">Minutes Played</option>
                            <option value="clean_sheets">Clean Sheets</option>
                            <option value="saves">Saves (Goalkeepers)</option>
                        </select>
                    </div>

                    <!-- SCOUT LIST CONTAINER -->
                    <div id="scout-list" class="overflow-y-auto flex-1 pr-1.5"></div>
                </div>

                <!-- COLUMN 2 (MIDDLE): EXPANDED TALLER PITCH & BENCH -->
                <div class="xl:col-span-6 bg-emerald-950/30 border-2 border-emerald-500/30 rounded-2xl p-5 relative h-[780px] flex flex-col justify-between shadow-2xl">
                    <div id="pitch" class="flex flex-col justify-around flex-grow py-2"></div>
                    <div class="border-t border-emerald-500/20 pt-4 mt-2">
                        <h4 class="text-xs font-bold text-emerald-400 uppercase mb-2 text-center tracking-wide">Substitutes Bench</h4>
                        <div id="bench" class="flex justify-center gap-3 min-h-[76px]"></div>
                    </div>
                </div>

                <!-- COLUMN 3 (RIGHT): SELECTED ROSTER PANEL -->
                <div class="xl:col-span-3 bg-purple-950/30 border border-purple-800/50 rounded-2xl p-4 flex flex-col h-[780px]">
                    <div class="flex justify-between items-center mb-3 pb-2 border-b border-purple-800/50">
                        <div>
                            <h3 class="text-sm font-bold uppercase text-purple-300">Selected Roster</h3>
                            <span class="text-[10px] text-purple-400 font-medium">Squad Management</span>
                        </div>
                        <button id="reset-squad-btn" onclick="resetSquad()" class="bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/80 text-[10px] font-black uppercase px-2.5 py-1.5 rounded-md transition-all flex items-center gap-1">
                            <span>🔄</span> Reset Squad
                        </button>
                    </div>

                    <div id="roster-scroll-container" class="overflow-y-auto flex-1 pr-1">
                        <table class="w-full text-left text-xs">
                            <thead class="sticky top-0 bg-slate-950/90 backdrop-blur-sm z-10">
                                <tr class="text-purple-400 border-b border-purple-800/50">
                                    <th class="pb-2">Player</th>
                                    <th class="pb-2 text-right pr-2">Action</th>
                                </tr>
                            </thead>
                            <tbody id="squad-table-body"></tbody>
                        </table>
                    </div>
                </div>

            </div>

        </div>

        <!-- PAGE 2: RECOMMENDATION TAB -->
        <div id="page-recommended" class="hidden flex flex-col gap-6 max-w-5xl mx-auto">
            <div class="bg-purple-950/40 border border-purple-800/50 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <span class="text-xs text-purple-300 uppercase font-bold block">AI Roster Cost</span>
                    <span id="ai-cost" class="text-2xl font-black text-white">£0.0m</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-purple-300 uppercase font-bold block">Predicted Total</span>
                    <span id="ai-pts" class="text-2xl font-black text-emerald-400">0.0 Pts</span>
                </div>
            </div>
            
            <!-- EXPANDED TALLER RECOMMENDATION PITCH -->
            <div class="bg-emerald-950/30 border-2 border-emerald-500/30 rounded-2xl p-8 relative min-h-[780px] flex flex-col justify-between shadow-2xl">
                <div id="ai-pitch" class="flex flex-col justify-around flex-grow py-4"></div>
                <div class="border-t border-emerald-500/20 pt-6 mt-4">
                    <h4 class="text-xs font-bold text-emerald-400 uppercase mb-3 text-center tracking-wider">Recommended Substitutes</h4>
                    <div id="ai-bench" class="flex justify-center gap-4 min-h-[90px]"></div>
                </div>
            </div>
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/pitch.js') }}?v={{ cache_bust }}"></script>
</body>
</html>
